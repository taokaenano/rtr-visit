<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTR Visit Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2f4f3; --panel:#ffffff; --card:#ffffff; --ink:#1d2125; --ink2:#5f6670; --ink3:#8a9099; --line:#dde2e0; --grid:#e9ecea;
  --brass:#e1251b; --brass-ink:#ffffff; --brass-soft:#fdeceb; --bad:#b23b3b; --warn:#a85a14; --ok:#2f8a4f;
  --gA:#2563c4; --gB:#2f8a4f; --gC:#c9a10e; --gN:#8a857c; --gS:#c4beb3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',system-ui,sans-serif;font-weight:400;font-size:15px;line-height:1.5}
.num,td.n,.kv b,.tile .v{font-variant-numeric:tabular-nums}
button{font-family:inherit}
.view{display:none}.view.on{display:block}
/* gate: same PIN screen as the field app (SIM-card slots + keypad) */
#gate.on{display:flex;flex-direction:column;max-width:460px;margin:0 auto;min-height:100vh}
.ph{background:var(--brass);color:#fff;border-radius:0 0 28px 28px;padding:20px 24px 26px;flex:1;display:flex;flex-direction:column}
.ph .top1{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.ph .ask{margin-top:auto;padding-top:40px}.ph h1{font-weight:500;font-size:26px;line-height:1.25;margin:0}
.slots{display:flex;gap:10px;margin-top:26px}.sim{flex:1;max-width:50px}.sim svg{display:block;width:100%;height:auto;overflow:visible}
.sim .body{fill:transparent;stroke:rgba(255,255,255,.5);stroke-width:2;transition:stroke .15s}.sim.cur .body,.sim.on .body,.perr .sim .body{stroke:#fff}
.sim .chip{transform-origin:25px 38px;transform:scale(.4);opacity:0;transition:transform .18s cubic-bezier(.3,1.4,.5,1),opacity .12s}.sim.on .chip{opacity:1;transform:scale(1)}
.chip rect{fill:#c9b98f}.chip path{stroke:#a8976b;stroke-width:1.4;fill:none}.perr .chip rect{fill:#f3b4ae}.perr .chip path{stroke:#d9776f}
.pbusy .sim.on .chip{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.pmsg{min-height:24px;margin-top:16px;font-size:15px;color:rgba(255,255,255,.88)}.pmsg.bad{color:#fff;font-weight:500}
.pad{padding:22px 18px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:64px;border:0;border-radius:16px;background:transparent;font:inherit;font-size:28px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.key:hover,.key:active{background:#e6e9e8}.key.blank{visibility:hidden}.key svg{width:28px;height:28px}.key:disabled{opacity:.35}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}
.gsrch{position:relative;padding:8px 16px 0}
.gsrch svg.i{position:absolute;left:28px;top:20px;color:var(--ink2);pointer-events:none}
.gsrch input{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 38px;min-height:40px;background:var(--bg)}
.gsrch input:focus{outline:2px solid var(--ink);background:var(--card)}
.gres{display:none;position:absolute;left:16px;right:16px;top:calc(100% + 4px);z-index:3000;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.14);max-height:60vh;overflow:auto;padding:6px}
.gres.on{display:block}
.gres .o{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}.gres .o:hover,.gres .o.hi{background:var(--bg)}
.gres .o .t{flex:1;min-width:0}.gres .o .t b{font-weight:500;display:block}.gres .o .t span{font-size:12px;color:var(--ink2)}
.navb{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px 12px;min-height:34px;font-size:13px;background:var(--card)}
.wh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinrow td{vertical-align:middle}.pinrow .acts{display:flex;gap:6px;justify-content:flex-end}
.form{display:grid;grid-template-columns:200px 1fr;gap:12px 14px;align-items:center;max-width:560px}
.form input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;background:var(--bg);width:100%}
.prog{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:var(--ok)}
.closebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.closebox input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:32px;width:160px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 16px;min-height:40px;cursor:pointer}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:500}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.45}
.msg{min-height:24px;margin-top:12px;font-size:14px;color:var(--ink2)}.msg.bad{color:var(--bad)}
/* masthead */
.mast{position:sticky;top:0;z-index:1000;background:var(--panel);border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 16px 0;flex-wrap:wrap}
.mrow h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
.chip{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.focus{flex:1;min-width:120px;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus b{color:var(--ink);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-width:40px;height:40px;cursor:pointer;font-size:13px;padding:0 10px}
.tabs{display:flex;gap:2px;padding:6px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;padding:8px 12px 9px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--brass)}
.tabs b{font-weight:500;font-size:12px;background:var(--brass);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
/* filter strip */
.fstrip{display:flex;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.fbox{position:relative;flex:none}
.fbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-height:34px;padding:4px 28px 4px 10px;cursor:pointer;white-space:nowrap;position:relative}
.fbtn::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:translateY(-70%) rotate(45deg)}
.fbtn.set{border-color:var(--brass);background:var(--brass-soft)}
.fbtn span{color:var(--ink2)}
.fpan{display:none;position:fixed;z-index:3000;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.14);padding:6px;width:260px;max-height:340px;overflow:auto}
.fpan.on{display:block}
.fpan input{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:4px;background:var(--bg)}
.fo{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.fo:hover{background:var(--bg)}
.fo.on{background:var(--brass-soft);font-weight:500;box-shadow:inset 3px 0 0 var(--brass)}
.fo small{color:var(--ink2);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink2);padding:4px 10px;font-size:13px;cursor:pointer;min-height:32px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;font-weight:500}
.fsearch{flex:none;width:210px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px;background:var(--bg)}
.fclear{flex:none;font-size:13px;color:var(--brass);background:none;border:0;cursor:pointer;white-space:nowrap}
.decide{padding:8px 16px 10px;font-size:14px;border-top:1px solid var(--line);background:var(--brass-soft)}
.decide b{font-weight:600}
.mvsw{display:none}
/* main */
.main{display:grid;grid-template-columns:minmax(460px,60%) minmax(0,1fr);height:calc(100vh - var(--hh,180px))}
#left{overflow:auto;padding:14px 16px 60px}
#left,#mapWrap{min-width:0}
#mapWrap{position:relative;border-left:1px solid var(--line);overflow:hidden}
#map{position:absolute;inset:0;background:#eef0ef}
.lensbar{position:absolute;top:10px;left:10px;right:10px;z-index:500;display:flex;gap:6px;pointer-events:none}
.lensbar .seg{pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:0 1 auto;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.legend{position:absolute;left:10px;bottom:22px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:260px}
.legend .lt{font-weight:500;font-size:12px;margin-bottom:4px}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:1px 0;white-space:nowrap}
.legend .sw{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.legend .cnt{margin-left:auto;padding-left:10px;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend hr{border:0;border-top:1px solid var(--line);margin:6px 0}
/* content */
h2.sec{font-size:15px;font-weight:600;margin:18px 0 8px}
h2.sec:first-child{margin-top:0}
.small{font-size:12px;color:var(--ink2)}
#left{container-type:inline-size}
.tiles{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d b{font-weight:500;color:var(--ink)}
.gcard{padding:14px}
.gh{margin-bottom:10px;font-size:15px}.gh b{font-weight:600}.gh span{font-size:12px;color:var(--ink2);margin-left:6px}
.pyr{display:grid;grid-template-columns:auto minmax(0,280px) minmax(0,280px);justify-content:center;column-gap:16px}
.pyr svg{width:100%;height:auto;display:block}
.pyr svg text{font-family:'Kanit',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.glab{display:grid;grid-template-rows:1fr 1fr 1fr;padding-right:8px}
.glab>div{display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line)}
.glab>div:last-child{border-bottom:0}
.glab b{font-weight:600;font-size:14px}.glab b span{font-weight:400;font-size:12px;color:var(--ink2)}
.glab .now{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.glab em,.mtab em{font-style:normal;font-weight:400;font-size:12px;color:var(--ink2);margin-left:4px}
.cap{text-align:center;font-size:13px;font-weight:500;margin-top:6px}.cap span{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.mtab{display:none;width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.mtab th{font-weight:400;color:var(--ink2);text-align:right;font-size:12px;padding:2px 4px}
.mtab td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mtab td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.mtab td i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mtab td span{font-size:11px;color:var(--ink2);font-weight:400;margin-left:4px}
.mtab td b{font-size:15px}
@container (max-width:520px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles .tile.wide{grid-column:1/-1}.tiles.t4,.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:20px}
  .pyr{grid-template-columns:1fr 1fr}.pyr .glab,.pyr .capsp{display:none}.mtab{display:table}
}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:24px;font-weight:600;line-height:1.25}
.tile .d{font-size:12px;color:var(--ink2)}
.up{color:#1f6f3f}.dn{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink2);font-size:14px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
table.t th{font-weight:500;color:var(--ink2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);background:#fafbfa;white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fafafa}
table.t tr.bench td{background:#f7f8f7;color:var(--ink2)}
table.t tr.flag td{background:var(--brass-soft)}
table.t tr.on td{background:var(--brass-soft)}
.nx{font-size:12px;color:var(--ink);font-weight:500}
.nx::before{content:"→ ";color:var(--brass)}
.tw{overflow-x:auto;border-radius:12px}
/* worklist */
.wcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--ink);cursor:pointer;font:inherit}
.wcard.hl{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.wcard.done{opacity:.62}
.w1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wname{font-weight:500}
.mcard{display:none;position:absolute;top:56px;right:10px;width:300px;max-width:calc(100% - 20px);z-index:600;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:12px}
.mcard.on{display:block}
.mcard .m1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mcard .mx{border:0;background:var(--line);color:var(--ink);width:28px;height:28px;border-radius:14px;cursor:pointer;flex:none;font-size:14px;line-height:1}
.mcard .btn{width:100%;margin-top:10px}
.wmeta{font-size:12px;color:var(--ink2)}
.why{margin-top:5px;font-size:13px;font-weight:500}
.why.t0{color:var(--bad)}.why.t1{color:var(--bad)}.why.t2{color:var(--warn)}.why.t3{color:var(--ink)}
.bench{font-size:12px;color:var(--ink2);margin-top:3px;white-space:pre-line}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chips span{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink2)}
.g{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;font-weight:600;color:#fff;border-radius:6px;font-size:12px;padding:0 4px}
.spark{display:flex;gap:2px;margin-top:6px}
.spark i{width:14px;height:14px;border-radius:3px;display:block}
.more{display:block;margin:10px auto}
/* store detail */
.hist{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:8px}
.hm{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:3px 0;border:1.5px solid transparent;border-radius:8px}
.hm.cur{border-color:var(--brass)}
.hm .sq{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:13px}
.hm b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:120px 1fr;gap:3px 10px;font-size:13px}
.kv span{color:var(--ink2)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;margin-bottom:10px;font-size:13px}
.tl .it::before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brass);border:2px solid #fff}
.lnk{color:var(--gA);text-decoration:none}
.slist .wcard{padding:8px 12px}
/* charts */
.chart{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chart svg{display:block;overflow:visible}
.tip{position:fixed;z-index:4000;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.4;display:none;max-width:260px}
.tip b{font-size:14px;font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.hbar .bar{height:12px;background:var(--grid);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--gA);border-radius:0 4px 4px 0}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.leaflet-tooltip{font-family:'Kanit',sans-serif;font-size:12px;border-radius:8px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.12);padding:5px 9px}
.leaflet-container{font-family:'Kanit',sans-serif}
@media (max-width:900px){
  .main{display:block;height:auto}
  .mvsw{display:flex;padding:6px 16px 8px;border-top:1px solid var(--line)}
  .mvsw .seg{width:100%}.mvsw .seg button{flex:1}
  #left{padding:12px 16px 80px}
  #mapWrap{display:none;height:calc(100vh - var(--hh,200px));border-left:0}
  body.mapmode #left{display:none}
  body.mapmode #mapWrap{display:block}
  .fsearch{width:170px}
  .legend{max-width:220px;bottom:12px}
  .focus{display:none}
  .mrow{padding:8px 12px 0;flex-wrap:nowrap;gap:6px}.mrow h1{font-size:15px}.mrow .chip{font-size:11px;padding:1px 7px;margin-right:auto}
  .lb{display:none}
  .tabs{padding:2px 6px 0}
  .fstrip{padding:6px 12px}
  .decide{font-size:13px;padding:6px 12px 8px}
  .lensbar .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
  .kv{grid-template-columns:100px 1fr}
}

/* ---- r19: pills, store list, map card, reload, people, visits ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:#f2f4f3;color:var(--ink2)}
.pill i{width:6px;height:6px;border-radius:3px;background:currentColor;display:inline-block}
.pill.due{background:#fdecea;color:#b42318;border-color:#f6c9c4}
.pill.rs{background:#fff;color:var(--ink);border-color:#cfd5d2}
.pill.up,.pill.ok{background:#e9f4ec;color:#1f6f3f;border-color:#c7e3cf}
.pill.dn{background:#fdecea;color:#b42318;border-color:#f6c9c4}
.pill.warn{background:#fff4dc;color:#8a5a00;border-color:#efd59b}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.slt td{vertical-align:middle}
.slt tr.hl td,.slt tr.on td{background:var(--brass-soft)}
.slt .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.slt .nm svg{flex:none}
.slt .sub{display:flex;white-space:nowrap;align-items:center;gap:6px;margin-top:3px;font:12px 'Kanit',sans-serif;color:var(--ink2)}
.slt .tag{white-space:nowrap;font:600 10.5px 'Kanit',sans-serif;color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.slt .tag.ina{color:#8a857c;background:#f2f1ee}

  ST.forEach(s=>{ if(!s.okxy) return; const m=L.circleMarker([s.lat,s.lon],{renderer:cv,radius:6,weight:1.5,color:"#ffffff",fillOpacity:.95});
    m.bindTooltip(()=>tipHtml(s),{direction:"top",offset:[0,-6],opacity:1}); m.on("mouseover",()=>hover(s.id,true,true)); m.on("mouseout",()=>hover(s.id,false,true)); m.on("click",()=>showCard(s.id)); MK[s.id]=m; });
  if(hbLayer) hbLayer.remove(); hbLayer=L.layerGroup(HB.map(h=>L.circleMarker([h[0],h[1]],{renderer:cv,radius:3,weight:0,fillColor:lvl(h[2]),fillOpacity:.55}).bindTooltip(()=>el("div",{},el("div",{text:"Happy Block · Nano Cluster "+h[3]}),el("div",{text:"true "+(+h[2]).toFixed(1)+"%"})),{direction:"top"})));
  if(vLayer) vLayer.remove(); vLayer=L.layerGroup(V.filter(v=>v.lat!=null&&v.lon!=null).map(v=>L.circleMarker([v.lat,v.lon],{renderer:cv,radius:4,weight:2,color:"#1d2125",fillColor:"#ffffff",fillOpacity:1}).bindTooltip(()=>el("div",{},el("div",{text:"จุดที่ไปเยี่ยม · "+(v.name||v.sid)}),el("div",{text:fmtD(v.at)+" · "+(v.filler||"")})),{direction:"top"})));
}
function tipHtml(s){ const e=el("div",{},el("div",{style:"font-weight:600",text:s.n}),el("div",{text:`${s.s==="inactive"?"inactive":"เกรด "+s.g9} · GA ${LASTM} ${fmt(s.ga[s.ga.length-1])} · ${s.o||"ไม่มีผู้ดูแล"}`}),
  el("div",{text:"→ "+s.act})); return e; }
function drawMap(list){ if(!map) return; const lz=LENSES[LENS], cats=lz.cats(), col={}; cats.forEach(c=>col[c[0]]=c[2]); const H=hid[LENS]=hid[LENS]||new Set(), ids=new Set(list.map(s=>s.id)), cc={};
  BADGE=map.getZoom()>=BADGE_Z; PINS=[];
  ST.forEach(s=>{ const m=MK[s.id]; if(!m) return; const k=lz.k(s); if(ids.has(s.id)) cc[k]=(cc[k]||0)+1; const on=lay.stores&&ids.has(s.id)&&!H.has(k);
    if(on&&BADGE) PINS.push({s,c:col[k]||"#999",k});
    if(on&&!BADGE){ m.setStyle({fillColor:col[k]||"#999"}); if(!map.hasLayer(m)) m.addTo(map); } else if(map.hasLayer(m)) m.remove(); });
  drawBadges();
  if(hl&&!BADGE&&MK[hl]&&map.hasLayer(MK[hl])) MK[hl].setStyle({radius:10,weight:3,color:"#1d2125"});
  lay.hb?hbLayer.addTo(map):hbLayer.remove(); lay.visits?vLayer.addTo(map):vLayer.remove(); lay.labels?lblLayer.addTo(map):lblLayer.remove();
  const lg=$("#legend"); lg.innerHTML=""; lg.append(el("div",{class:"lt",style:"display:flex;justify-content:space-between;gap:8px;cursor:pointer",onclick:()=>{ lgOpen=!lgOpen; drawMap(FS()); }},el("span",{text:lz.t}),el("span",{text:lgOpen?"ย่อ ▾":"คำอธิบาย ▸"})));
  if(!lgOpen) return;
  cats.forEach(([k,t,c])=>{ const cb=el("input",{type:"checkbox"}); cb.checked=!H.has(k); cb.addEventListener("change",()=>{ cb.checked?H.delete(k):H.add(k); drawMap(FS()); });
    lg.append(el("label",{},cb,el("i",{class:"sw",style:`background:${c}`}),el("span",{text:t}),el("span",{class:"cnt",text:fmt(cc[k]||0)}))); });
  const nox=list.filter(s=>!s.okxy).length; if(nox) lg.append(el("div",{class:"small",style:"margin-top:2px",text:`ไม่มีพิกัด ${fmt(nox)}`}));
  lg.append(el("hr"));
  [["stores","ร้าน RTR"],["hb",`จุด Happy Block (${fmt(HB.length)})`],["visits",`จุดที่ไปเยี่ยม (${fmt(V.filter(v=>v.lat!=null).length)})`],["labels","ชื่อถนน / สถานที่"]].forEach(([k,t])=>{
    const cb=el("input",{type:"checkbox"}); cb.checked=lay[k]; cb.addEventListener("change",()=>{ lay[k]=cb.checked; if(k==="hb") autoHB=false; drawMap(FS()); }); lg.append(el("label",{},cb,el("span",{text:t}))); }); }
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawBadges(){ if(!bcv) return; const sz=map.getSize(), dpr=window.devicePixelRatio||1;
  if(bcv.width!==Math.round(sz.x*dpr)||bcv.height!==Math.round(sz.y*dpr)){ bcv.width=Math.round(sz.x*dpr); bcv.height=Math.round(sz.y*dpr); bcv.style.width=sz.x+"px"; bcv.style.height=sz.y+"px"; }
  const c=bctx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,sz.x,sz.y); BHITS=[]; if(!BADGE) return;
  const bb=map.getBounds().pad(0.15), grade=LENS==="grade";
  const list=PINS.filter(p=>bb.contains([p.s.lat,p.s.lon])).sort((a,b)=>(grade?LAYER[a.k]-LAYER[b.k]:0)||b.s.lat-a.s.lat);
  const sel=[CARD,hl].filter(Boolean); list.sort((a,b)=>sel.includes(a.s.id)-sel.includes(b.s.id));
  list.forEach(({s,c:fill,k})=>{ const p=map.latLngToContainerPoint([s.lat,s.lon]), big=sel.includes(s.id), w=big?34:26, h=w, tail=7, x=p.x-w/2, y=p.y-h-tail;
    c.fillStyle=fill; c.strokeStyle=big?"#1d2125":"#ffffff"; c.lineWidth=big?3:1.5; rrect(c,x,y,w,h,7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(p.x-5,y+h-0.5); c.lineTo(p.x,p.y); c.lineTo(p.x+5,y+h-0.5); c.closePath(); c.fill(); if(big){ c.stroke(); rrect(c,x+1.5,y+1.5,w-3,h-3,6); c.fill(); }
    if(grade){ if(k==="S"){ const cx=p.x, cy=y+h/2, r=big?6:5; c.strokeStyle="#5f6670"; c.lineWidth=big?2.6:2.2; c.lineCap="round"; c.beginPath(); c.moveTo(cx-r,cy-r); c.lineTo(cx+r,cy+r); c.moveTo(cx+r,cy-r); c.lineTo(cx-r,cy+r); c.stroke(); c.lineCap="butt"; }
      else { c.fillStyle=k==="C"?"#1c1a17":"#fff"; c.font=`600 ${big?17:14}px Kanit, sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(LETTER[k],p.x,y+h/2+1); } }
    BHITS.push({id:s.id,x0:x,y0:y,x1:x+w,y1:p.y}); }); }
function bHit(pt){ const T=6; for(let i=BHITS.length-1;i>=0;i--){ const h=BHITS[i]; if(pt.x>=h.x0-T&&pt.x<=h.x1+T&&pt.y>=h.y0-T&&pt.y<=h.y1+T) return h.id; } return null; }
let hl=null, lgOpen=window.innerWidth>900, autoHB=false;
function hover(id,on,fromMap){ const m=MK[id];
  if(on){ if(hl&&hl!==id&&hl!==CARD) hover(hl,false); hl=id; if(m&&map&&map.hasLayer(m)){ m.setStyle({radius:10,weight:3,color:"#1d2125"}); m.bringToFront(); if(!fromMap) m.openTooltip(); }
    $$(`#left [data-id="${CSS.escape(id)}"]`).forEach(c=>c.classList.add("hl")); }
  else { if(id===CARD) return; if(m){ m.setStyle({radius:6,weight:1.5,color:"#ffffff"}); if(!fromMap) m.closeTooltip(); } $$(`#left [data-id="${CSS.escape(id)}"]`).forEach(c=>c.classList.remove("hl")); if(hl===id) hl=null; }
  if(BADGE) drawBadges(); }
function fitAll(){ fitList(ST); }
function fitFiltered(){ fitList(FS()); }
function fitList(list){ if(!map) return; const pts=list.filter(s=>s.okxy).map(s=>[s.lat,s.lon]); if(pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:15}); }
